# The A1 road (job 20-a1-road, "Done when" 19): the written dialogues are imported and checked, the
# voices read them, the review pages are made. Manual start only, never on a pull request or a push.
#
# Tasks:
# - import: reads the markdown, runs Voikko and the free checks on every dialogue and uploads the drafts,
#   the check report, the word notes still missing and the files they are written in. No key is used and
#   no AI call is made.
# - analyse: counts the words above each candidate frequency rank cap and the forms outside the grammar
#   list, to choose a part's rank cap and record its extras. No key.
# - count-characters: the exact number of characters the voices must read for the part. No key.
# - voice: the Azure voice reads both versions of every line of the part (input part 1 to 6), inside the
#   free allowance, at most 20 requests a minute. Only this step holds the Azure key.
# - judge: the register judge on the lines of the part (or the road), after its golden set. Only this
#   step holds the Anthropic key. Used only when the owner turned the judge on.
# - review-pages: round 1 review pages for the part's dialogues. No key.
# - count-words: the dry count of the word clips (job word-audio): clips and exact characters per part,
#   still to make. No key.
# - voice-words: the Azure voice (Selma) reads every word clip of the part still missing, at most 600 in
#   one run (30 minutes at 20 a minute); the run says how many remain. Only this step and the voice step
#   hold the Azure key. The clips come back under content/word-audio/ with the voice log.
# - review-words: the owner's listening page of the part's word clips (words-part-<n>.html). No key.
# - publish: publishes one part the owner approved in writing (content/approvals/part-<n>.json on the
#   branch it runs on): its migrations, its clips under public/audio/ and the regenerated
#   supabase/tests/database/a1_road_published.test.sql come back as an artifact. No key.
# - check-islands: the language island lines (content/islands/islands.md, owner approved on 3 November
#   2026): Voikko on every written word of every line each stop can make, the spoken to written word
#   mapping, and the words not met in the road by that stop. Reports only. No key. The part is ignored.
# - count-islands: the dry count of the island clips: clips and exact characters still to make. No key.
# - voice-islands: Selma reads every island line once per choice in its list, spoken and written, at
#   most 600 clips in one run. Only this step, the voice step and the voice-words step hold the Azure
#   key. The clips come back under content/island-audio/ with the voice log; the manager commits them,
#   then runs `python scripts/generate/islands.py publish-islands` to copy them to public/audio/islands/.
#   The part is ignored. The stop 1 name sentence is never voiced.
# - voice-aleksi: Harri (the male Finnish voice) reads Aleksi's one greeting on the intro screen,
#   "Moi! Mä oon Aleksi." (fast route aleksi-intro, 4 November 2026), into public/audio/aleksi/. One clip,
#   19 characters. Only this step and the other voice steps hold the Azure key. The clip comes back with
#   the voice log; the builder commits both. The part is ignored.
# - voice-aleksi-samples: voice samples of the same greeting for the owner to choose from (owner,
#   4 November 2026): Harri as is, slower and warmer, brighter, and Azure's male multilingual voices
#   that list fi-FI, reading it as Finnish. 19 characters each. They come back as the artifact only,
#   with samples.txt and the voice log, and never go to public/. Same step and key as voice-aleksi.
#
# The manager commits the voice log (content/logs/ai-calls.jsonl) after every voice run and
# before the next one, because the character guard reads the log from the checkout: characters of a
# run whose log was not committed would be forgotten. The voice task refuses to start when that log
# has uncommitted changes, and so do the voice-words and voice-islands tasks.
# Voiced clips and changed drafts go up as an artifact; the manager commits them once, under
# content/drafts/<slug>/audio/. They reach public/audio/ only when a part is published.
#
# No npm ci runs in this job, so no package code ever runs next to a key. Every file is checked for the
# key values before the upload. Every action is pinned to a full commit, with its version in a comment.
name: A1 road

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to do
        required: true
        type: choice
        options:
          [
            import,
            analyse,
            count-characters,
            voice,
            judge,
            review-pages,
            count-words,
            voice-words,
            review-words,
            publish,
            check-islands,
            count-islands,
            voice-islands,
            voice-aleksi,
            voice-aleksi-samples,
          ]
      part:
        description: The part, 1 to 6, or all (only count-characters, count-words and judge accept all)
        required: true
        type: choice
        default: '1'
        options: ['1', '2', '3', '4', '5', '6', all]
      only:
        description: Only for voice, optional. One dialogue slug, to voice a sample
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: a1-road

jobs:
  road:
    name: A1 road
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Voikko (Finnish morphology) from Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvoikko1 voikko-fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-pipeline.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check the inputs
        # The inputs reach the shell only as environment variables.
        env:
          TASK: ${{ inputs.task }}
          PART: ${{ inputs.part }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ] && ! [[ "$ONLY" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "The dialogue slug must be lower case letters, digits and hyphens"; exit 1
          fi
          case "$TASK" in check-islands|count-islands|voice-islands|voice-aleksi|voice-aleksi-samples) exit 0 ;; esac
          if [ "$PART" = all ] && [ "$TASK" != count-characters ] && [ "$TASK" != judge ] && [ "$TASK" != import ] && [ "$TASK" != analyse ] && [ "$TASK" != count-words ]; then
            echo "The task $TASK needs one part, 1 to 6"; exit 1
          fi
      - name: Import, analyse, count or make review pages (no key)
        if: inputs.task == 'import' || inputs.task == 'analyse' || inputs.task == 'count-characters' || inputs.task == 'review-pages' || inputs.task == 'count-words' || inputs.task == 'review-words'
        env:
          TASK: ${{ inputs.task }}
          PART: ${{ inputs.part }}
        run: |
          part_args=()
          if [ "$PART" != all ]; then part_args=(--part "$PART"); fi
          case "$TASK" in
            import) python scripts/generate/road_import.py import --out "$RUNNER_TEMP/road-out" "${part_args[@]}" ;;
            analyse) python scripts/generate/road_import.py analyse --out "$RUNNER_TEMP/road-out" ;;
            count-characters) python scripts/generate/road_import.py count-characters "${part_args[@]}" ;;
            review-pages) python scripts/generate/pipeline.py review-pages --part "$PART" --out "$RUNNER_TEMP/road-out" ;;
            count-words) python scripts/generate/road_import.py count-words --part "$PART" ;;
            review-words) python scripts/generate/road_import.py review-words --part "$PART" --out "$RUNNER_TEMP/road-out" ;;
          esac
      - name: Check or count the island lines (no key)
        # check-islands needs Voikko, installed above. It refuses to start when content/islands/islands.md
        # is not the file the owner approved (content/approvals/islands.json).
        if: inputs.task == 'check-islands' || inputs.task == 'count-islands'
        env:
          TASK: ${{ inputs.task }}
        run: |
          case "$TASK" in
            check-islands) python scripts/generate/islands.py check-islands --out "$RUNNER_TEMP/road-out" ;;
            count-islands) python scripts/generate/islands.py count-islands ;;
          esac
      - name: Publish one approved part (no key)
        # Needs the owner's approval file content/approvals/part-<n>.json on main. Writes the part's
        # migrations, its audio under public/audio/ and the published road's pgTAP test. The manager
        # commits them on a branch, runs the checks and merges.
        if: inputs.task == 'publish'
        env:
          PART: ${{ inputs.part }}
        run: |
          python scripts/generate/pipeline.py publish-part --part "$PART"
          python scripts/generate/road_pgtap.py
      - name: Voice the part (the Azure key is here and nowhere else)
        if: inputs.task == 'voice'
        env:
          PART: ${{ inputs.part }}
          ONLY: ${{ inputs.only }}
          VOICE_PROVIDER: azure
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_TIER: ${{ vars.AZURE_SPEECH_TIER }}
        run: |
          only_args=()
          if [ -n "$ONLY" ]; then only_args=(--only "$ONLY"); fi
          python scripts/generate/road_import.py voice --part "$PART" "${only_args[@]}"
      - name: Voice the part's word clips (the Azure key is here and in the voice step, nowhere else)
        if: inputs.task == 'voice-words'
        env:
          PART: ${{ inputs.part }}
          VOICE_PROVIDER: azure
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_TIER: ${{ vars.AZURE_SPEECH_TIER }}
        run: python scripts/generate/road_import.py voice-words --part "$PART"
      - name: Voice the island lines (the Azure key is here, in the voice step and in the voice-words step, nowhere else)
        if: inputs.task == 'voice-islands'
        env:
          VOICE_PROVIDER: azure
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_TIER: ${{ vars.AZURE_SPEECH_TIER }}
        run: python scripts/generate/islands.py voice-islands
      - name: Voice Aleksi's greeting (the Azure key is here and in the other voice steps, nowhere else)
        if: inputs.task == 'voice-aleksi' || inputs.task == 'voice-aleksi-samples'
        env:
          TASK: ${{ inputs.task }}
          VOICE_PROVIDER: azure
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_TIER: ${{ vars.AZURE_SPEECH_TIER }}
        run: |
          case "$TASK" in
            voice-aleksi) python scripts/generate/aleksi_greeting.py voice-aleksi ;;
            voice-aleksi-samples) python scripts/generate/aleksi_greeting.py samples --out "$RUNNER_TEMP/road-out/aleksi-voices" ;;
          esac
      - name: Run the register judge (the Anthropic key is here and nowhere else)
        if: inputs.task == 'judge'
        env:
          PART: ${{ inputs.part }}
          AI_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          part_args=()
          if [ "$PART" != all ]; then part_args=(--part "$PART"); fi
          python scripts/generate/road_import.py judge "${part_args[@]}"
      - name: Gather what the run changed
        if: success() || failure()
        env:
          TASK: ${{ inputs.task }}
        run: |
          mkdir -p "$RUNNER_TEMP/road-out"
          if [ "$TASK" = voice ] || [ "$TASK" = judge ]; then
            cp -r content/drafts "$RUNNER_TEMP/road-out/drafts"
            cp content/logs/ai-calls.jsonl "$RUNNER_TEMP/road-out/ai-calls.jsonl" || true
          fi
          if [ "$TASK" = voice-words ]; then
            if [ -d content/word-audio ]; then cp -r content/word-audio "$RUNNER_TEMP/road-out/word-audio"; fi
            cp content/logs/ai-calls.jsonl "$RUNNER_TEMP/road-out/ai-calls.jsonl" || true
          fi
          if [ "$TASK" = voice-islands ]; then
            if [ -d content/island-audio ]; then cp -r content/island-audio "$RUNNER_TEMP/road-out/island-audio"; fi
            cp content/logs/ai-calls.jsonl "$RUNNER_TEMP/road-out/ai-calls.jsonl" || true
          fi
          if [ "$TASK" = voice-aleksi-samples ]; then
            cp content/logs/ai-calls.jsonl "$RUNNER_TEMP/road-out/ai-calls.jsonl" || true
          fi
          if [ "$TASK" = voice-aleksi ]; then
            if [ -d public/audio/aleksi ]; then cp -r public/audio/aleksi "$RUNNER_TEMP/road-out/aleksi"; fi
            cp content/logs/ai-calls.jsonl "$RUNNER_TEMP/road-out/ai-calls.jsonl" || true
          fi
          if [ "$TASK" = publish ]; then
            git ls-files --others --modified --exclude-standard -- supabase public \
              | while IFS= read -r f; do cp --parents "$f" "$RUNNER_TEMP/road-out/"; done
          fi
      - name: Check the files to upload hold no secret value
        id: upload-guard
        if: success() || failure()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
        run: >-
          node scripts/ci/check-files-for-secrets.ts
          --env ANTHROPIC_API_KEY --env AZURE_SPEECH_KEY
          "$RUNNER_TEMP/road-out"
      - name: Keep the result
        if: (success() || failure()) && steps.upload-guard.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: road-${{ inputs.task }}-${{ inputs.part }}
          path: ${{ runner.temp }}/road-out/
          if-no-files-found: ignore
          retention-days: 30

# The automatic checks for every pull request (factory step 4), then the
# private preview link. Each job is one check on the pull request page.
# Specs: factory/jobs/1-stack/spec.md ("Done when" 10, 12 and 13),
# factory/jobs/2-smoke/spec.md ("Done when" 10 and 11),
# factory/jobs/3-data-model/spec.md ("Done when" 3, 15, 16 and 18),
# factory/jobs/6-pr-local-db/spec.md (browser tests on a throwaway database) and
# factory/jobs/7-content-pipeline/spec.md ("Done when" 12 and 16).
# Secrets used: the Supabase TEST project (browser tests after merge, preview),
# its database connection string (only the job that applies migrations to the
# test project) and the Cloudflare token and Access service token (preview
# only). Never live values. The pull request browser tests hold no secret.
# Owner's rule from job 3-data-model (20 October 2026): database changes reach
# the shared test project only after the owner approves a job, which is when it
# is merged to main. Pull requests test their migrations, and run the browser
# tests, on a throwaway local database and never change the test project.
# Actions not made by GitHub are pinned to a full commit, with the version in a
# comment, so a moved tag cannot change code that receives a secret.
#
# Until the MVP launch (owner's decision of 3 November 2026, job fast-checks):
# no test runs on a pull request or a push. Each change gets only the secret
# scan (the repository is public), a pull request also gets its preview link
# (no browser test against it), and a push to main applies new migrations to
# the test project and then uploads the main preview link (job main-link,
# https://main-puhuscribe-preview.fumnanya.workers.dev). Every test runs in the full run, started by hand (Actions,
# Checks, Run workflow, tick "full"): the type check, lint and format, the unit
# tests, the Python tests, the dependency check, every database test, every
# browser test on Chromium and WebKit, and on main the browser tests against the
# test project. The owner runs it once, when everything is set for the MVP
# launch. No test is deleted. After the launch, removing the full-run `if:`
# lines from the test jobs brings back the fast run (the @smoke browser tests
# on Chromium, and the database tests only when scripts/ci/checks-plan.ts says
# the change needs them).
name: Checks

on:
  pull_request:
  push:
    branches: [main]
    # A push to main that changes only factory notes or recording files runs
    # none of these checks. Such a push holds no app code and no migration, so
    # the apply job has nothing to do. GitHub requires no check on this
    # repository (branch protection is not available on its plan). Those
    # pushes still get a secret scan from secret-scan-notes.yml. Pull requests
    # are never filtered by path.
    paths-ignore:
      - 'factory/**'
      - 'recording/**'
  # Manual run. The secret scan then reads the full git history. Tick "full"
  # for the one full run before the MVP launch.
  workflow_dispatch:
    inputs:
      full:
        description: 'Full run: every browser test on Chromium and WebKit, every database test, and on main the browser tests against the test project (about 30 minutes)'
        type: boolean
        default: false

# Pull requests: a newer push to the same pull request cancels the older run
# (saves check minutes). Pushes to main and manual runs: each run is its own
# group, so no run cancels another and every merge run finishes (job 4-tooling,
# "Done when" 17). GitHub cancels a waiting run when a newer one joins the same
# group even without cancel-in-progress, so main runs cannot share one group.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.12'
  # 'true' only in a manual run with "full" ticked. Steps read it as $FULL_RUN.
  FULL_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}

jobs:
  changes:
    name: Which checks this change needs
    # Decides whether the database tests run. A manual run always runs them.
    # Otherwise they run when the change touches supabase/, a scripts/generate/
    # file that writes SQL tests or migrations, or another file the database
    # job reads (scripts/ci/checks-plan.ts lists them). When the changed files
    # cannot be listed, they run. No secret, no npm ci, no branch packages.
    # Until the MVP launch it runs in the full run only (see the top).
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      database: ${{ steps.plan.outputs.database }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The base of the pull request, or the commit before the push, for the diff.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Do the database tests need to run?
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -o pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            database=true
            echo "A manual run: the database tests run."
          elif [ -z "$BASE_SHA" ] || ! changed=$(git diff --name-only --no-renames "$BASE_SHA...HEAD"); then
            database=true
            echo "The changed files could not be listed, so the database tests run."
          else
            echo "Changed files:"
            printf '%s\n' "$changed"
            database=$(printf '%s\n' "$changed" | node scripts/ci/checks-plan.ts database-tests)
          fi
          if [ "$database" = false ]; then
            echo "::notice title=Database tests skipped::This change touches no file under supabase/, no scripts/generate/ file that writes SQL, and no other file the database tests depend on (scripts/ci/checks-plan.ts), so the database tests (pgTAP) were skipped. A manual run of this workflow runs them."
          fi
          echo "Database tests needed: $database"
          echo "database=$database" >> "$GITHUB_OUTPUT"

  code:
    name: Type check, lint, format
    # Until the MVP launch: the full run only (see the top).
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The GitHub token is not left in .git/config while branch code,
          # npm install scripts and tools run.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Type check (TypeScript strict)
        run: npm run typecheck
      - name: Lint (ESLint)
        if: success() || failure()
        run: npm run lint
      - name: Format (Prettier)
        if: success() || failure()
        run: npm run format:check

  unit:
    name: Unit tests (Vitest)
    # Until the MVP launch: the full run only (see the top).
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The GitHub token is not left in .git/config while branch code,
          # npm install scripts and tools run.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Speaking feedback golden set (npm run eval:speech)
        # Job 10-speaking-feedback, "Done when" 11: prints the pass rate of the
        # 30 golden cases and fails below the PRD's 90 percent. npm test runs
        # the same file; this step shows the rate in the log.
        if: success() || failure()
        run: npm run eval:speech

  python:
    name: Python tests and lint (pytest, ruff)
    # Until the MVP launch: the full run only (see the top).
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The GitHub token is not left in .git/config while branch code,
          # npm install scripts and tools run.
          persist-credentials: false
      - name: Install Voikko (Finnish morphology) from Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvoikko1 voikko-fi
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements*.txt
      - run: pip install -r scripts/requirements.txt -r scripts/requirements-dev.txt -r scripts/requirements-pipeline.txt
      - name: Lint (ruff)
        run: ruff check scripts
      - name: Format (ruff)
        if: success() || failure()
        run: ruff format --check scripts
      - name: Voikko gate and content pipeline tests (pytest, no API key, no network)
        if: success() || failure()
        # unshare --net runs pytest with networking switched off, so no test can
        # call an AI or voice provider. The keys are removed from the environment.
        run: |
          sudo unshare --net -- sudo -u "$USER" env -u ANTHROPIC_API_KEY -u AZURE_SPEECH_KEY "PATH=$PATH" \
            python -m pytest scripts/generate --junitxml=pytest-results.xml
      - name: All 318 Python tests ran and passed (the 9 Voikko gate tests among them)
        # Every Python test runs in the fast run and in the full run; none is
        # left for the full run only. The count only ever goes up: 9 at first,
        # 138 after job 7-content-pipeline ("Done when" 12), 193 after job
        # 12-units-1-3, 308 after job 20-a1-road, 317 after its later rounds and
        # 318 when part 1 was published. No test is removed: v2's 9 Voikko gate
        # tests must still be in the results.
        if: success() || failure()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("pytest-results.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          counts = {k: int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")}
          print(counts)
          assert counts == {"tests": 318, "failures": 0, "errors": 0, "skipped": 0}, counts
          v2 = {c.get("name") for c in suite.iter("testcase") if c.get("classname", "").endswith("test_voikko_gate")}
          print(len(v2), "Voikko gate tests")
          assert len(v2) == 9, v2
          PY
      - name: Content checks on every committed draft and published dialogue (no network)
        # Statements 7 to 11 and 21 of job 7-content-pipeline, offline. A failing
        # check on any committed Finnish content turns the pull request red.
        if: success() || failure()
        run: |
          sudo unshare --net -- sudo -u "$USER" env -u ANTHROPIC_API_KEY -u AZURE_SPEECH_KEY "PATH=$PATH" \
            python scripts/generate/pipeline.py check-committed

  database:
    name: Database tests (local Supabase, pgTAP)
    # A throwaway Supabase database inside the runner: Postgres only, started
    # empty, with every migration in supabase/migrations applied in order. Then
    # the pgTAP security tests in supabase/tests run against it. No secrets.
    # Runs when the "Which checks this change needs" job says the change needs
    # it. Until the MVP launch that job runs in the full run only, so this job
    # does too, and always says yes there.
    needs: [changes]
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The throwaway database's own fixed local address (not a secret).
      LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs the Supabase CLI version pinned in package-lock.json, checked
      # against the npm registry. No npm ci: branch packages are not installed.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
      - name: Start a throwaway database and apply every migration
        run: supabase db start
      - name: Database security tests (pgTAP)
        run: supabase test db
      - name: Parallel database tests, from two connections at once (pgTAP with dblink)
        # supabase/tests/database/analytics_parallel.test.sql (job 14-analytics)
        # opens more connections to this throwaway database with dblink, to
        # prove that two requests at the same moment cannot beat a limit. A
        # second connection needs the database password: this database's fixed
        # local one, already in LOCAL_DB_URL above, not a secret, given to this
        # one session only. Everywhere else (supabase test db above, the test
        # project after a merge) the file skips its tests. Here all 9 must
        # pass and none may be skipped.
        run: |
          set -o pipefail
          out=$(PGOPTIONS='-c puhuscribe.parallel_test_password=postgres' psql "$LOCAL_DB_URL" --no-psqlrc --tuples-only --no-align -v ON_ERROR_STOP=1 -f supabase/tests/database/analytics_parallel.test.sql)
          echo "$out"
          echo "$out" | grep -qx '1\.\.9'
          test "$(echo "$out" | grep -c '^ok ')" -eq 9
          if echo "$out" | grep -qE '^not ok|# SKIP|# Looks like'; then exit 1; fi
      - name: Run every reference data load a second time
        # The loads are upserts, so a second run must change nothing. The pgTAP
        # tests below then prove the row counts and contents are still exact.
        run: |
          for file in supabase/migrations/*_load_v2_*.sql; do
            echo "Loading $file again"
            psql "$LOCAL_DB_URL" --no-psqlrc --quiet -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Run every publish migration a second time
        # Job 7-content-pipeline ("Done when" 16). A publish migration does nothing
        # when its dialogue is already published; the pgTAP tests below then
        # prove the published content is unchanged.
        run: |
          shopt -s nullglob
          for file in supabase/migrations/*_publish_*.sql; do
            echo "Publishing $file again"
            psql "$LOCAL_DB_URL" --no-psqlrc --quiet -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Load the made-up starter sentences twice, then roll back
        # The starter sentence loader, run on made-up fixture data (the owner's
        # corrections to v2's 104 sentences are not in yet). Proves the
        # generated SQL runs and that a second load adds no duplicates.
        run: psql "$LOCAL_DB_URL" --no-psqlrc --quiet -v ON_ERROR_STOP=1 -f scripts/v2-import/fixtures/check-load-twice.sql
      - name: Database tests again after the second load (pgTAP)
        run: supabase test db
      - name: The committed TypeScript types match the migrated database
        # src/lib/database.types.ts is made by the Supabase CLI from this same
        # database. If a migration changed and the types were not regenerated,
        # this step fails and prints the difference.
        run: |
          supabase gen types --lang typescript --local --schema public > "$RUNNER_TEMP/database.types.ts"
          diff -u src/lib/database.types.ts "$RUNNER_TEMP/database.types.ts"
      - name: Keep the freshly generated types when they differ
        # So the builder can commit the CLI's exact output. The file holds only
        # table and column names, no data and no secret.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: database-types
          path: ${{ runner.temp }}/database.types.ts
          if-no-files-found: ignore
          retention-days: 7

  apply-test-db:
    name: Apply database changes to the test project
    # Runs only on a push to main, which happens when the owner approves a job
    # and it is merged (owner's rule from job 3-data-model). Never on a pull
    # request, another branch or a manual run. Until the MVP launch (owner's
    # decision of 3 November 2026) no database test runs before it: it runs on
    # every push to main, so content publishing reaches the test project. A
    # push with no new migration applies nothing. If an apply fails, re-run
    # the failed jobs of that run from its Actions page.
    # The test database password (SUPABASE_TEST_DB_URL) is used here and nowhere
    # else. This job runs no npm ci and no project code, so the password is
    # never present while branch packages run, and it is passed only to the two
    # steps that need it. Dependabot never pushes to main and gets no secrets.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
    # Two applies never run at once, and none is dropped: a second main run's
    # apply waits in this queue until the first one has finished.
    concurrency:
      group: apply-test-db
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
      - name: Apply new migrations to the test project
        # Applies only migrations the test project has not had yet; a second
        # run on an unchanged branch applies nothing.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
      - name: Database security tests against the test project (pgTAP)
        # The same tests as above, now on the test project itself. They run in
        # one transaction that is rolled back, so they leave no rows. Until the
        # MVP launch they run only in the full run (owner, 3 November 2026: "I
        # want all tests paused till we are done").
        if: env.FULL_RUN == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: supabase test db --db-url "$SUPABASE_DB_URL"

  browser:
    name: Browser tests (Playwright, local Supabase)
    # Until the MVP launch: the full run only (see the top). After the launch,
    # without the if line below, every pull request (Dependabot included),
    # push to main and manual run. The fast run tests Chromium only, with the
    # tests tagged @smoke: the road,
    # one whole lesson through Hear it, Understand it, Say it and Keep it, the
    # word card, sign in, the account page and privacy. The full run (a manual
    # run with "full" ticked) runs every test on Chromium and WebKit, then the
    # @empty-content tests. A throwaway Supabase
    # inside this runner, started empty with every migration in
    # supabase/migrations applied, so a pull request that adds a table can test
    # it before the owner approves it. Nothing is shared with any other run, so
    # parallel jobs cannot disturb each other. Only Postgres and the services
    # the app uses start (kong, the API gateway; postgrest; gotrue, sign in;
    # mailpit, the mail catcher that receives the sign in code emails, added by
    # job 11-accounts); a job that needs another removes its name from -x.
    # This job holds no secret. The local stack makes its own keys, which work
    # only on this runner, and the database is never opened to the internet.
    # It waits for no other job.
    # Spec: factory/jobs/6-pr-local-db/spec.md.
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The throwaway database's own fixed local address (not a secret).
      LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          # The GitHub token is not left in .git/config while branch code,
          # npm install scripts and tools run.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # npm ci also installs the Supabase CLI at the version pinned in
      # package-lock.json, the same version the database check uses.
      - run: npm ci
      - name: Start a throwaway Supabase and apply every migration
        # The start output lists the local keys. Lines naming a key, secret,
        # JWT, password or publishable key, or holding a key shaped value
        # (sb_..., eyJ...), are left out of the log. The keys work only on
        # this runner, but no key belongs in a log.
        run: |
          set -o pipefail
          npx supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor 2>&1 | { grep -viE 'key|secret|jwt|password|publishable|sb_|eyJ' || true; }
      - name: Local Supabase settings for the local Worker
        # Only the local API address and the local publishable key, written to
        # .env.local on the runner (git ignores it). The script prints names
        # only and refuses any address that is not on this runner.
        run: npx supabase status -o env | node scripts/ci/write-test-settings.ts env .env.local --from-supabase-status
      - name: The fake speech provider for the local Worker
        # Job 10-speaking-feedback, "Done when" 12: browser tests never reach a
        # real speech service. The fake replays recorded answers from
        # worker/providers/fixtures/speech/. Only this pull request job sets it;
        # wrangler.jsonc and the deploy jobs never do
        # (tests/speech-provider-rules.test.ts).
        run: echo "SPEECH_FEEDBACK_PROVIDER=fake" >> .env.local
      - name: A local owner page for the local Worker
        # Job 14-analytics: the owner page answers on 127.0.0.1 or [::1], the
        # same server under another name (the app stays on localhost), and
        # its Access token check uses a key made here for this run only
        # (scripts/ci/test-owner-access.ts). worker/owner.ts trusts that key
        # only while the owner host is this computer. No secret.
        run: node scripts/ci/test-owner-access.ts >> .env.local
      - name: Load the browser test seed files
        # Every supabase/seeds/browser/*.sql in name order, stopping at the
        # first error. Only this job loads them; they never reach a hosted
        # database.
        run: |
          export LC_ALL=C
          shopt -s nullglob
          files=(supabase/seeds/browser/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No browser seed files in supabase/seeds/browser/"
          fi
          for file in "${files[@]}"; do
            echo "Loading $file"
            psql "$LOCAL_DB_URL" --no-psqlrc --quiet -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Hide the road's units from the browser tests
        # Job 20-a1-road, "Done when" 23. Once the road is published, its units (positions 1 to 36) sit
        # in every throwaway database before the fixture units (900 and up), and every browser test
        # that wants "the first dialogue" would get road content. Their setup is changed here, never an
        # assertion: the road's units are set back to draft in this throwaway database, as the empty
        # content pass below does for every unit. With no road published this changes nothing.
        run: |
          psql "$LOCAL_DB_URL" --no-psqlrc --quiet -v ON_ERROR_STOP=1 -c "update public.units set status = 'draft' where stop_number is not null and status = 'approved'"
      - name: Build the app and its Worker
        # VITE_DESIGN_REFERENCE=1 builds in the design pages (job
        # 5-design-system), so the browser tests can check them. Not a secret.
        env:
          VITE_DESIGN_REFERENCE: '1'
        run: npm run build
      - name: Install Chromium (and WebKit in the full run)
        run: |
          if [ "$FULL_RUN" = true ]; then
            npx playwright install --with-deps chromium webkit
          else
            npx playwright install --with-deps chromium
          fi
      - name: Browser tests at 375 x 812 against the built app
        # Fast run: Chromium, the @smoke tests. Full run: every test, both browsers.
        run: |
          if [ "$FULL_RUN" = true ]; then
            npx playwright test
          else
            npx playwright test --project=chromium --grep @smoke
          fi
      - name: The app made guest accounts in the throwaway database
        # Proves the app talked to this runner's database, not another one.
        # Job 8-first-session dropped the visits table this step used to
        # count; the browser tests' guests (anonymous sign ins) are counted
        # instead. Only a number is printed.
        run: |
          guests=$(psql "$LOCAL_DB_URL" --no-psqlrc --tuples-only --no-align -v ON_ERROR_STOP=1 -c "select count(*) from auth.users where is_anonymous")
          echo "Guest accounts in the throwaway database: $guests"
          if [ "$guests" -lt 1 ]; then
            echo "The browser tests made no guest account in the throwaway database."
            exit 1
          fi
      - name: Browser tests with no readable dialogue
        # Job 8-first-session, "Done when" 6: with an empty content database
        # the session screen says it is not ready. Every unit is set back to
        # draft in this throwaway database (which hides every dialogue), then
        # only the tests tagged @empty-content run. Each first proves nothing
        # is readable. Their files go to their own folder, kept below. Full run
        # only: these tests are not in the fast set.
        if: env.FULL_RUN == 'true'
        run: |
          psql "$LOCAL_DB_URL" --no-psqlrc --quiet -v ON_ERROR_STOP=1 -c "update public.units set status = 'draft' where status = 'approved'"
          PUHUSCRIBE_EMPTY_CONTENT=1 npx playwright test --grep @empty-content --reporter=list --output=test-results-empty-content
      - name: Keep the report, screenshots and videos
        # The evaluator watches these. No secret was set in this job.
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            test-results-empty-content/
          retention-days: 14

  browser-test-project:
    name: Browser tests against the test project (after merge)
    # The full run only: a manual run on main with "full" ticked (owner's
    # decision of 3 November 2026). Pushes to main no longer run it. The test
    # project already holds main's migrations, applied by the merge run's apply
    # job; in a manual run that job is skipped, so this job checks it was not
    # run here and that the database tests passed. Tests tagged @seed need rows
    # that exist only in the throwaway database, so they are left out here.
    # The only browser test job that receives the test project settings.
    needs: [database, apply-test-db]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.full && github.ref == 'refs/heads/main' && needs.database.result == 'success' && needs.apply-test-db.result == 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The GitHub token is not left in .git/config while branch code,
          # npm install scripts and tools run.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Fetch the Switzer font files (optional)
        # The font files are kept out of this public repository (docs/fonts.md).
        # A read only deploy key held in the FONTS_DEPLOY_KEY secret lets this
        # script copy them from a private repository. With no secret it prints a
        # notice and the build continues with the fallback fonts; the tests that
        # need Switzer then skip themselves with a reason. Only this step sees
        # the key, and the script never prints it.
        env:
          FONTS_DEPLOY_KEY: ${{ secrets.FONTS_DEPLOY_KEY }}
        run: node scripts/ci/fetch-private-fonts.ts
      - name: Test project settings for the local Worker
        # Written to .env.local on the runner only (git ignores it). The build
        # copies them to the Worker side for `vite preview`, and the secret
        # check then proves they are in no browser file.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_PUBLISHABLE_KEY }}
        run: node scripts/ci/write-test-settings.ts env .env.local
      - name: Build the app and its Worker
        # VITE_DESIGN_REFERENCE=1 builds in the design pages (job
        # 5-design-system), so the browser tests can check them. Not a secret.
        env:
          VITE_DESIGN_REFERENCE: '1'
        run: npm run build
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Browser tests at 375 x 812 against the built app
        # No trace and no HTML report: they would hold the Switzer font files
        # this job fetched, and this repository's artifacts are public.
        env:
          PUHUSCRIBE_NO_TRACE: '1'
        # @email tests read codes from the local mail catcher; the test
        # project's built in sender reaches only the Supabase team (job
        # 11-accounts), so they are left out here, like @seed.
        run: npx playwright test --grep-invert "@seed|@email"
      - name: Check the files to upload hold no secret value
        id: upload-guard
        if: success() || failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_PUBLISHABLE_KEY }}
        run: >-
          node scripts/ci/check-files-for-secrets.ts
          --env SUPABASE_URL --env SUPABASE_PUBLISHABLE_KEY
          playwright-report test-results
      - name: Keep the screenshots and videos
        # Only pictures and videos, never a trace or an HTML report.
        if: (success() || failure()) && steps.upload-guard.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots-and-videos-test-project
          path: |
            test-results/**/*.png
            test-results/**/*.webm
          if-no-files-found: ignore
          retention-days: 14

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No pull request comments: the red check is enough, and a comment
          # could quote the leaked line.
          GITLEAKS_ENABLE_COMMENTS: 'false'

  dependencies:
    name: Dependency check (npm audit, pip-audit)
    # Until the MVP launch: the full run only (see the top).
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The GitHub token is not left in .git/config while branch code,
          # npm install scripts and tools run.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (high and critical)
        run: npm audit --audit-level=high
      - uses: actions/setup-python@v7
        if: success() || failure()
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: pip-audit
        if: success() || failure()
        run: |
          pip install -r scripts/requirements-dev.txt
          pip-audit -r scripts/requirements.txt -r scripts/requirements-pipeline.txt

  preview:
    name: Preview link (Cloudflare Worker behind Access)
    # Only after the secret scan passed, and only on pull requests in this
    # repository. Dependabot pull requests get no secrets, so they skip it.
    # On a pull request the apply job is always skipped (owner's rule), so it
    # is checked by name: the secret scan must have succeeded, and the test
    # project must not have been changed. Until the MVP launch (owner's
    # decision of 3 November 2026) no test runs on a pull request, so the
    # preview waits for nothing else, runs no browser test, and its comment
    # says so. Before this decision the preview also ran the fast browser
    # tests when the Access service token secrets were set (see git history).
    needs: [secrets, apply-test-db]
    if: >-
      !cancelled() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.secrets.result == 'success' && needs.apply-test-db.result == 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      BRANCH: ${{ github.head_ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The GitHub token is not left in .git/config while branch code,
          # npm install scripts and tools run.
          persist-credentials: false
          # The base branch's history too, for the migration diff below.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Fetch the Switzer font files (optional)
        # The font files are kept out of this public repository (docs/fonts.md).
        # A read only deploy key held in the FONTS_DEPLOY_KEY secret lets this
        # script copy them from a private repository. With no secret it prints a
        # notice and the build continues with the fallback fonts; the tests that
        # need Switzer then skip themselves with a reason. Only this step sees
        # the key, and the script never prints it.
        env:
          FONTS_DEPLOY_KEY: ${{ secrets.FONTS_DEPLOY_KEY }}
        run: node scripts/ci/fetch-private-fonts.ts
      - name: Does this pull request change the database?
        # True when the pull request adds, changes or deletes a file under
        # supabase/migrations/ compared with its base branch (three-dot diff).
        # The preview uses the shared test project, which gets those changes
        # only after the owner approves the job (job 6-pr-local-db).
        id: database
        run: |
          set -o pipefail
          changed=$(git diff --name-only --no-renames "$BASE_SHA...HEAD" | node scripts/ci/preview-plan.ts database-changed)
          echo "Database changed in this pull request: $changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Build the app and its Worker
        # Preview links include the design pages (job 5-design-system). They
        # stay behind Cloudflare Access like the rest of the preview. Not a secret.
        env:
          VITE_DESIGN_REFERENCE: '1'
        run: npm run build
      - name: Make a readable alias from the branch name
        id: alias
        # The alias `main` belongs to the main-preview job below. A branch
        # whose name turns into `main` would replace the owner's main link,
        # so it is refused.
        run: |
          alias=$(node scripts/ci/preview-alias.ts)
          if [ "$alias" = main ]; then
            echo "::error title=Preview alias taken::The branch name $BRANCH turns into the alias main, which is kept for the main link. Rename the branch."
            exit 1
          fi
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
      - name: Upload a preview version of puhuscribe-preview
        id: upload
        # A version upload does not change what the Worker's main address
        # serves. Its secrets are the TEST project's, passed in a temporary
        # file that is deleted straight after.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_PUBLISHABLE_KEY }}
          # Speaking feedback (job 10-speaking-feedback): the Azure Speech key
          # becomes a Worker secret, beside its EU region and price tier.
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_TIER: ${{ vars.AZURE_SPEECH_TIER }}
          ALIAS: ${{ steps.alias.outputs.alias }}
        run: |
          # Without the CLOUDFLARE_ACCOUNT_ID secret, wrangler finds the
          # account from the API token itself. An empty value is removed so
          # wrangler does not read it as an account.
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node scripts/ci/write-test-settings.ts json "$secrets_file"
          npx wrangler versions upload \
            --preview-alias "$ALIAS" \
            --secrets-file "$secrets_file" \
            --tag "pr-$PR_NUMBER" \
            --message "PR #$PR_NUMBER at ${HEAD_SHA:0:7}" | tee "$RUNNER_TEMP/upload.log"
          url=$(grep -oE "https://$ALIAS-puhuscribe-preview[.][a-z0-9-]+[.]workers[.]dev" "$RUNNER_TEMP/upload.log" | head -1)
          if [ -z "$url" ]; then echo "No preview alias address in the upload output"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Post the preview link on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.url }}
          DB_CHANGED: ${{ steps.database.outputs.changed }}
          # No browser test runs on a pull request until the MVP launch.
          TESTS_RAN: 'false'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(node scripts/ci/preview-plan.ts comment)
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$body"

  main-preview:
    name: Main preview link (Cloudflare Worker behind Access)
    # Job main-link (owner's fast route, 3 November 2026). Preview links exist
    # only per pull request, so merged work had no address. On every push to
    # main this job uploads a version of the same puhuscribe-preview Worker
    # with the fixed alias `main`, so the owner always has
    # https://main-puhuscribe-preview.fumnanya.workers.dev behind the same
    # Cloudflare Access lock. Each push replaces what the alias serves.
    # Only after the secret scan passed, and after "Apply database changes to
    # the test project" succeeded, so the link never shows code ahead of its
    # database. If the apply fails, this job is skipped; re-running the failed
    # jobs of that run brings it back. Dependabot never pushes to main and gets
    # no secrets. The build and upload are the pull request preview's, with
    # the same secret guards. No browser test runs, nothing is uploaded as an
    # artifact (the Switzer font files are in the build), and nothing is
    # posted; the link is written to the run's summary page.
    needs: [secrets, apply-test-db]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.actor != 'dependabot[bot]' &&
      needs.secrets.result == 'success' && needs.apply-test-db.result == 'success'
    # Two main uploads never run at once, and none is dropped: like the apply
    # job, a newer push's upload waits in this queue, so uploads run in push
    # order and the newest main is the one the link shows.
    concurrency:
      group: main-preview
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The GitHub token is not left in .git/config while branch code,
          # npm install scripts and tools run.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Fetch the Switzer font files (optional)
        # As in the pull request preview: only this step sees the deploy key,
        # the script never prints it, and without it the build uses the
        # fallback fonts.
        env:
          FONTS_DEPLOY_KEY: ${{ secrets.FONTS_DEPLOY_KEY }}
        run: node scripts/ci/fetch-private-fonts.ts
      - name: Build the app and its Worker
        # The design pages are built in, as on the pull request previews. They
        # stay behind Cloudflare Access like the rest. Not a secret.
        env:
          VITE_DESIGN_REFERENCE: '1'
        run: npm run build
      - name: Upload the main version of puhuscribe-preview
        id: upload
        # A version upload does not change what the Worker's main address
        # serves. Its secrets are the TEST project's, passed in a temporary
        # file that is deleted straight after.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_PUBLISHABLE_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_TIER: ${{ vars.AZURE_SPEECH_TIER }}
          ALIAS: main
        run: |
          # Without the CLOUDFLARE_ACCOUNT_ID secret, wrangler finds the
          # account from the API token itself. An empty value is removed so
          # wrangler does not read it as an account.
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node scripts/ci/write-test-settings.ts json "$secrets_file"
          npx wrangler versions upload \
            --preview-alias "$ALIAS" \
            --secrets-file "$secrets_file" \
            --tag main \
            --message "main at ${HEAD_SHA:0:7}" | tee "$RUNNER_TEMP/upload.log"
          url=$(grep -oE "https://$ALIAS-puhuscribe-preview[.][a-z0-9-]+[.]workers[.]dev" "$RUNNER_TEMP/upload.log" | head -1)
          if [ -z "$url" ]; then echo "No main alias address in the upload output"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Write the main link on the run's summary page
        env:
          URL: ${{ steps.upload.outputs.url }}
        run: |
          echo "Main preview link, main at ${HEAD_SHA:0:7}, behind Cloudflare Access: $URL" >> "$GITHUB_STEP_SUMMARY"

# The live app, Aleksi, on https://meetaleksi.com (job go-live; owner approved going live on
# 4 November 2026). Started by hand only (Actions, Live, Run workflow, branch main), never on a push
# or a pull request. Pick one task per run. Run them in this order the first time:
#
# - migrations: applies every migration in supabase/migrations/ that the live project does not have
#   yet, with `supabase db push`. The approved dialogues are published by their own migrations
#   (supabase/migrations/*_publish_*.sql, written by `pipeline.py publish-part` from the owner's
#   approval files), exactly as they reach the test project, so this task also puts the approved
#   content in. No seed or fixture file is ever loaded: `db push` loads seed files only when its
#   seed flag is passed, which it never is here, and the browser test seeds are not named here.
# - content: lists the live project's migration history and checks every migration of this branch,
#   each publish migration included, is in it. It reads only that history, never learner data.
# - app: builds the production app (CLOUDFLARE_ENV=production, VITE_DESIGN_REFERENCE=0, so no design
#   or sample pages) and deploys the Worker "aleksi" with the live project's settings, on
#   meetaleksi.com and www.meetaleksi.com (the Worker sends www to the apex). It has no workers.dev or
#   preview address and is not behind Cloudflare Access. Then it asks the two addresses for their
#   headers only (no page is counted as a visit and the database is not asked).
#
# Every task first runs the job "Approved content (no secret)": every dialogue the owner approved
# (content/approvals/part-<n>.json) has its publish migration and no other dialogue is published,
# and every file under public/audio/ is approved. Then it checks the live settings name the live
# project and not the test project (scripts/ci/check-live-settings.ts).
#
# Secrets: SUPABASE_LIVE_DB_URL (the live database password) only in the steps of "migrations" and
# "content" that call the Supabase CLI. Those jobs run no npm ci and no project package, so the
# password is never present while package code runs. SUPABASE_LIVE_URL and
# SUPABASE_LIVE_PUBLISHABLE_KEY, the Azure, Anthropic and Turnstile keys and the Cloudflare token reach
# only the deploy step of "app", through a temporary file that is deleted straight after. Actions
# not made by GitHub are pinned to a full commit, with the version in a comment; GitHub's own are
# pinned the same way here.
name: Live

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'What to do on the live project (run migrations, then content, then app)'
        required: true
        type: choice
        options: [migrations, content, app]

permissions:
  contents: read

# One live run at a time; a second run waits for the first instead of cancelling it.
concurrency:
  group: live
  queue: max

env:
  NODE_VERSION: '24'

jobs:
  approved:
    name: Approved content (no secret)
    # Only on main: a branch could carry migrations or content the owner has not approved.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Every approved dialogue has its publish migration, and only those are published
        run: node scripts/ci/check-approved-dialogues.ts
      - name: Every audio file under public/audio/ is approved
        if: success() || failure()
        run: node scripts/ci/check-published-audio.ts

  migrations:
    name: Apply migrations to the live project
    needs: [approved]
    if: github.ref == 'refs/heads/main' && inputs.task == 'migrations'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Installs the Supabase CLI version pinned in package-lock.json. No project package is installed.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
      - name: The settings name the live project, not the test project
        env:
          LIVE_SUPABASE_URL: ${{ secrets.SUPABASE_LIVE_URL }}
          LIVE_DB_URL: ${{ secrets.SUPABASE_LIVE_DB_URL }}
          TEST_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
        run: node scripts/ci/check-live-settings.ts
      - name: List the migrations the live project does not have yet (dry run, changes nothing)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_LIVE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run --include-all
      - name: Apply them (no seed file is loaded)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_LIVE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes --include-all

  content:
    name: Check the approved content is in the live project
    needs: [approved]
    if: github.ref == 'refs/heads/main' && inputs.task == 'content'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
      - name: The settings name the live project, not the test project
        env:
          LIVE_SUPABASE_URL: ${{ secrets.SUPABASE_LIVE_URL }}
          LIVE_DB_URL: ${{ secrets.SUPABASE_LIVE_DB_URL }}
          TEST_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
        run: node scripts/ci/check-live-settings.ts
      - name: Every migration of main, each publish migration included, is in the live project
        # Reads the migration history table only (versions and names), never learner data.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_LIVE_DB_URL }}
        run: |
          set -o pipefail
          supabase migration list --db-url "$SUPABASE_DB_URL" | node scripts/ci/check-live-migrations.ts

  app:
    name: Build and deploy the live Worker (aleksi on meetaleksi.com)
    needs: [approved]
    if: github.ref == 'refs/heads/main' && inputs.task == 'app'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The GitHub token is not left in .git/config while npm install scripts run.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Fetch the Switzer font files (optional)
        # As on the previews (docs/fonts.md): only this step sees the deploy key, the script never
        # prints it, and without it the build uses the fallback fonts.
        env:
          FONTS_DEPLOY_KEY: ${{ secrets.FONTS_DEPLOY_KEY }}
        run: node scripts/ci/fetch-private-fonts.ts
      - name: The settings name the live project, not the test project
        env:
          LIVE_SUPABASE_URL: ${{ secrets.SUPABASE_LIVE_URL }}
          TEST_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
        run: node scripts/ci/check-live-settings.ts
      - name: Build the production app and its Worker
        # CLOUDFLARE_ENV=production picks the "production" environment of wrangler.jsonc (the Worker
        # aleksi on meetaleksi.com). VITE_DESIGN_REFERENCE=0 leaves out the design reference page and
        # the sample pages (tests/design-build.test.ts). Neither is a secret.
        env:
          CLOUDFLARE_ENV: production
          VITE_DESIGN_REFERENCE: '0'
        run: npm run build
      - name: The build is the live Worker, with no design pages
        run: node scripts/ci/check-live-build.ts
      - name: Deploy the live Worker
        # The live project's settings and the provider keys become Worker secrets, passed in a
        # temporary file that is deleted straight after. The Turnstile pair is required: without it
        # the live Worker would refuse to make any guest (worker/providers/human-check.ts).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_LIVE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_LIVE_PUBLISHABLE_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_TIER: ${{ vars.AZURE_SPEECH_TIER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          if [ -z "$TURNSTILE_SITE_KEY" ] || [ -z "$TURNSTILE_SECRET" ]; then
            echo "::error title=Turnstile keys missing::TURNSTILE_SITE_KEY and TURNSTILE_SECRET must both be GitHub secrets. Nothing was deployed."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node scripts/ci/write-test-settings.ts json "$secrets_file"
          npx wrangler deploy --secrets-file "$secrets_file" --message "live at ${HEAD_SHA:0:7}"
      - name: The two addresses answer (headers only)
        # HEAD requests: no page is counted as a visit (worker/visits.ts counts GET only) and the
        # database is not asked. A new custom domain can take a few minutes to get its certificate,
        # so each address is tried for up to 5 minutes.
        run: |
          check() {
            for attempt in $(seq 1 20); do
              answer=$(curl -sS -o /dev/null -I -w '%{http_code} %{redirect_url}' --max-time 10 "$1" || true)
              if [ "$answer" = "$2" ]; then echo "$1 answers $answer"; return 0; fi
              echo "$1 answered '$answer', expected '$2' (try $attempt of 20)"
              sleep 15
            done
            return 1
          }
          check https://meetaleksi.com/ '200 '
          check https://www.meetaleksi.com/learn '301 https://meetaleksi.com/learn'
      - name: Write the live address on the run's summary page
        run: echo "Live at https://meetaleksi.com, main at ${HEAD_SHA:0:7}" >> "$GITHUB_STEP_SUMMARY"

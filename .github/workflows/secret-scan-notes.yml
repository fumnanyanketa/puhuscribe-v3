# Secret scan for pushes to main that change factory notes or recording
# files. checks.yml skips pushes that change only those folders (to save about
# 14 minutes of checks each time), so this keeps the secret scan on them.
# Job 6-pr-local-db (factory/jobs/6-pr-local-db/build.md, the manager's extra
# statement). It also runs when such a push changes other files; checks.yml
# then scans them too, which costs a few seconds.
# The action is pinned to a full commit, with the version in a comment, as in
# checks.yml.
name: Secret scan of notes

on:
  push:
    branches: [main]
    paths:
      - 'factory/**'
      - 'recording/**'

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No comments: the red check is enough, and a comment could quote
          # the leaked line.
          GITLEAKS_ENABLE_COMMENTS: 'false'

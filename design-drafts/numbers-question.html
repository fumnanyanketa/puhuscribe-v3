<style>
  /* Layout: every v1 screen in the final mint and peach look, grouped by where it sits in the app, phones in wrapping rows with one short caption each. */
  :root {
    --page: #f1f2f3;
    --page-ink: #1b1d20;
    --page-quiet: #5b5f66;
    --frame: #1b1d20;
    --font: 'Poppins', 'Segoe UI', system-ui, sans-serif;
    --a: #23917a;
    --a-deep: #1a6f5d;
    --a-mid: #74bba9;
    --a-soft: #d6efe7;
    --wash1: #cbede1;
    --wash2: #fbe2d1;
    --b: #ee8763;
    --b-deep: #b8532f;
    --b-soft: #fde4d8;
    --ink: #1b2a26;
    --quiet: #637570;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --page: #111315;
      --page-ink: #eceef0;
      --page-quiet: #a3a8ae;
      --frame: #000;
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --page: #111315;
    --page-ink: #eceef0;
    --page-quiet: #a3a8ae;
    --frame: #000;
    color-scheme: dark;
  }
  body {
    background: var(--page);
    color: var(--page-ink);
    font: 400 15px/1.55 var(--font);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 2.5rem 4rem;
  }
  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    display: grid;
    gap: 3rem;
  }
  h1 {
    font: 600 clamp(1.8rem, 5vw, 2.4rem)/1.1 var(--font);
    letter-spacing: -0.02em;
    margin: 0;
  }
  h2 {
    font: 600 1.35rem/1.2 var(--font);
    margin: 0;
  }
  header,
  section {
    display: grid;
    gap: 1rem;
  }
  header p,
  section > p {
    color: var(--page-quiet);
    margin: 0;
    max-width: 66ch;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 2rem 1.6rem;
  }
  figure {
    margin: 0;
    display: grid;
    gap: 0.45rem;
    width: 300px;
    max-width: 100%;
    align-content: start;
  }
  figcaption {
    font-size: 0.85rem;
    color: var(--page-quiet);
  }
  figcaption b {
    display: block;
    color: var(--page-ink);
    font-weight: 600;
    font-size: 0.95rem;
  }

  /* Phone and the app's own look (always light inside the phone). */
  .phone {
    width: 300px;
    max-width: 100%;
    height: 640px;
    border-radius: 44px;
    background: var(--frame);
    padding: 10px;
    box-sizing: border-box;
  }
  .s {
    position: relative;
    height: 100%;
    border-radius: 35px;
    overflow: hidden;
    color: var(--ink);
    font-family: var(--font);
    font-size: 11px;
    letter-spacing: 0.005em;
    background: linear-gradient(165deg, var(--wash1) 0%, #f7f8f6 50%, var(--wash2) 100%);
    display: flex;
    flex-direction: column;
  }
  .status {
    flex: none;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    font-size: 10.5px;
    font-weight: 600;
    position: relative;
    z-index: 9;

  .status i {

    height: 18px;

  }
  .body {
    flex: 1;

    display: flex;
    flex-direction: column;
    gap: 11px;
    padding: 6px 16px 16px;
  }
  .grow {
    flex: 1;
  }

    background: linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.68));

    box-shadow:

  }
  .vista {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 170px;

    mask-image: linear-gradient(#000 70%, transparent);
  }
  .vista svg {

    height: 100%;

  }

    color: #fff;

  .pill i {

    font-weight: 500;

    font-size: 10px;

  }

  .top {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .round {
    background: rgba(255, 255, 255, 0.88) !important;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    flex: none;
    position: relative;
  }
  .x::before,
  .x::after {
    content: '';
    position: absolute;
    width: 11px;
    height: 1.6px;
    background: var(--ink);
    border-radius: 2px;
    transform: rotate(45deg);
  }
  .x::after {
    transform: rotate(-45deg);
  }
  .back::before {
    content: '';
    width: 7px;
    height: 7px;

    box-shadow: 0 10px 24px -8px rgba(0, 0, 0, 0.4);

  }
  .wc-head {

  }

  }
  .s {
    --wr: #4f6d94;

  }
  .rail .v {

  .s .pi.w {

      .map((x, i) => {
        const h = 7 + ((i * 5) % 5),
          b = 112 + Math.sin(x / 30) * 4
        return `<path d="M${x} ${(b - h).toFixed(1)} L${(x - h * 0.38).toFixed(1)} ${b.toFixed(1)} L${(x + h * 0.38).toFixed(1)} ${b.toFixed(1)} Z" fill="#a9d3c2"/>`
      })
      .join('')
    return `<div class="vista"><svg viewBox="0 0 280 170" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4efe5"/><stop offset="1" stop-color="#f5f8f5"/></linearGradient><radialGradient id="${k}s" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#fff4ec"/><stop offset=".6" stop-color="#fcd7c4"/><stop offset="1" stop-color="#f6b89c"/></radialGradient></defs>
  <rect width="280" height="170" fill="url(#${k})"/>
  <path d="M0 96 C 50 70, 90 80, 130 60 C 160 48, 200 72, 240 66 C 260 62, 275 74, 280 78 L280 170 L0 170 Z" fill="#e2f1ea"/>
  <circle cx="214" cy="98" r="17" fill="url(#${k}s)" stroke="#f1946f" stroke-width="1"/>
  <path d="M0 110 C 40 92, 80 96, 112 110 C 140 120, 175 102, 205 106 C 235 110, 260 98, 280 102 L280 170 L0 170 Z" fill="#cfe8dd"/>
  ${pines}
  <path d="M0 124 C 60 112, 120 126, 170 118 C 210 112, 250 120, 280 116 L280 170 L0 170 Z" fill="#e9f4ee"/></svg></div>`
  }
  const ph = (inner) =>
    `<div class="phone"><div class="s"><div class="status"><span>9:41</span><i></i><span>5G</span></div>${inner}</div></div>`
  const topBar = (pct, label, kind = 'x') =>
    `<div class="top"><span class="round milk ${kind}"></span><span class="track"><b style="width:${pct}%"></b></span><span class="steplabel">${label}</span></div>`
  const backBar = (label) =>
    `<div class="top"><span class="round milk back"></span><span style="font-weight:500;font-size:13.5px">${label}</span></div>`
  const lineCard = (
    o = {},
  ) => `<div class="milk line"><div class="lhead"><span class="who">${o.who || 'Pekka'}</span>${o.noplay ? '' : '<span class="small">Line 2 of 8</span>'}</div>
  <div class="pair2"><div class="rail"><i class="d t"></i><i class="l"></i><i class="d v"></i></div>
  <div class="rows"><div class="spoken"><span>${o.s || 'Paljonks <span class="mk">noi</span> mansikat maksaa?'}</span>${o.noplay ? '' : '<i class="pi"></i>'}</div>
  <div class="written"><span>${o.w || 'Paljonko <span class="mk">nuo</span> mansikat maksavat?'}</span>${o.noplay ? '' : '<i class="pi w"></i>'}</div></div></div>
  ${o.en ? `<div class="en">${o.en}</div>` : ''}</div>`
  const waveBars = (warm) =>
    `<div class="wave ${warm ? 'warm' : ''}">${[8, 14, 22, 12, 26, 18, 10, 20, 28, 14, 18, 24, 10, 16, 22, 8, 18, 12].map((h) => `<i style="height:${h}px"></i>`).join('')}</div>`

  /* Road, same drawing as the journey screen. */
  const W = 280,
    H = 620,
    HORIZON = 238,
    BOTTOM = 660
  const yAt = (t) => HORIZON + (BOTTOM - HORIZON) * Math.pow(1 - t, 1.9)
  const xAt = (t) => 142 + 34 * Math.sin(t * Math.PI * 1.7) * (1 - t * 0.9)
  const wAt = (t) => 168 * Math.pow(1 - t, 1.55) + 3
  const f = (n) => n.toFixed(1)
  const edge = (side, from, to, k = 1) => {
    const p = []
    for (let i = 0; i <= 70; i++) {
      const t = from + ((to - from) * i) / 70
      p.push([xAt(t) + (side * wAt(t) * k) / 2, yAt(t)])
    }
    return p
  }
  const poly = (from, to, k = 1) =>
    [...edge(-1, from, to, k), ...edge(1, from, to, k).reverse()].map((p) => p.map(f).join(',')).join(' ')
  const line = (pts) => pts.map((p) => p.map(f).join(',')).join(' ')
  const quad = (t0, t1, k, c, op) => {
    const w0 = Math.max(0.45, wAt(t0) * k),
      w1 = Math.max(0.4, wAt(t1) * k)
    return `<polygon points="${[
      [xAt(t0) - w0, yAt(t0)],
      [xAt(t0) + w0, yAt(t0)],
      [xAt(t1) + w1, yAt(t1)],
      [xAt(t1) - w1, yAt(t1)],
    ]
      .map((p) => p.map(f).join(','))
      .join(' ')}" fill="${c}" opacity="${op}"/>`
  }
  const dashes = (from, to) => {
    let o = ''
    for (let i = 0; i < 30; i++) {
      const t0 = from + ((to - from) * i) / 30,
        t1 = t0 + ((to - from) * 0.5) / 30
      o += quad(t0, t1, 0.026, '#ffffff', 0.95)
    }
    return o
  }
  const solid = (to) => {
    let o = ''
    for (let i = 0; i < 24; i++) {
      const t0 = (to * i) / 24,
        t1 = (to * (i + 1)) / 24 + 0.002
      o += quad(t0, t1, 0.032, '#8ce6cb', 1)
    }
    return o
  }
  const pines = (c) => {
    let o = ''
    ;[8, 18, 27, 39, 52, 61, 74, 88, 98, 186, 197, 209, 221, 232, 246, 257, 268, 276].forEach((x, i) => {
      const h = 9 + ((i * 7) % 6),
        b = 234 + Math.sin(x / 40) * 4
      o += `<path d="M${x} ${f(b - h)} L${x - h * 0.38} ${f(b)} L${x + h * 0.38} ${f(b)} Z" fill="${c}"/>`
    })
    return o
  }
  const land = (doneTo, eve) => {
    const id = 'g' + uid++
    const sky = eve ? ['#30405a', '#6c6f8e', '#e8b9a6'] : ['#dff3eb', '#f3f6ef', '#fde9dc']
    const ground = eve ? ['#56677a', '#7b8794', '#c9a99c'] : ['#d7ece2', '#e8f2ea', '#f9e6d8']
    return `<svg class="land" viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs>
  <linearGradient id="sk${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset=".75" stop-color="${sky[1]}"/><stop offset="1" stop-color="${sky[2]}"/></linearGradient>
  <linearGradient id="gr${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${ground[0]}"/><stop offset=".45" stop-color="${ground[1]}"/><stop offset="1" stop-color="${ground[2]}"/></linearGradient>
  <linearGradient id="as${id}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2c3234"/><stop offset=".6" stop-color="#465052"/><stop offset="1" stop-color="${eve ? '#6d7680' : '#8f9f9a'}"/></linearGradient>
  <radialGradient id="su${id}" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#fff4ec"/><stop offset=".6" stop-color="#fcd7c4"/><stop offset="1" stop-color="#f6b89c"/></radialGradient>
  <clipPath id="ab${id}"><rect x="0" y="0" width="${W}" height="${HORIZON + 2}"/></clipPath></defs>
  <rect width="${W}" height="${H}" fill="url(#sk${id})"/>
  ${eve ? '<circle cx="64" cy="120" r="1.2" fill="#fff"/><circle cx="210" cy="96" r="1" fill="#fff"/><circle cx="160" cy="140" r="1.1" fill="#fff" opacity=".8"/><circle cx="40" cy="180" r=".9" fill="#fff" opacity=".7"/>' : ''}
  <path d="M66 ${HORIZON} C 104 ${HORIZON - 52}, 136 ${HORIZON - 92}, 160 ${HORIZON - 94} C 184 ${HORIZON - 92}, 216 ${HORIZON - 52}, 254 ${HORIZON} Z" fill="${eve ? '#56667c' : '#e1ebf0'}"/>
  <path d="M146 ${HORIZON - 86} C 152 ${HORIZON - 93}, 168 ${HORIZON - 93}, 174 ${HORIZON - 86} C 168 ${HORIZON - 83}, 164 ${HORIZON - 86}, 160 ${HORIZON - 82} C 156 ${HORIZON - 86}, 151 ${HORIZON - 83}, 146 ${HORIZON - 86} Z" fill="#ffffff" opacity="${eve ? 0.5 : 0.95}"/>
  <path d="M-4 ${HORIZON} C 30 ${HORIZON - 42}, 62 ${HORIZON - 70}, 86 ${HORIZON - 72} C 110 ${HORIZON - 70}, 140 ${HORIZON - 42}, 172 ${HORIZON} Z" fill="${eve ? '#4e5c71' : '#d6e8e4'}"/>
  <path d="M156 ${HORIZON} C 182 ${HORIZON - 30}, 204 ${HORIZON - 50}, 222 ${HORIZON - 52} C 240 ${HORIZON - 50}, 262 ${HORIZON - 30}, 288 ${HORIZON} Z" fill="${eve ? '#475569' : '#cde5da'}"/>
  <path d="M150 ${HORIZON - 34} C 175 ${HORIZON - 38}, 208 ${HORIZON - 44}, 222 ${HORIZON - 51} C 186 ${HORIZON - 58}, 118 ${HORIZON - 60}, 86 ${HORIZON - 71} C 108 ${HORIZON - 80}, 146 ${HORIZON - 86}, 160 ${HORIZON - 93}" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round" opacity="${eve ? 0.55 : 0.9}"/>
  <g clip-path="url(#ab${id})"><g transform="translate(0 ${eve ? 22 : 0})"><circle cx="150" cy="${HORIZON - 6}" r="44" fill="#fde4d8" opacity="${eve ? 0.25 : 0.6}"/><circle cx="150" cy="${HORIZON - 6}" r="30" fill="url(#su${id})" stroke="#f1946f" stroke-width="1.5"/><text x="150" y="${HORIZON - 12}" text-anchor="middle" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#b8532f">A1</text></g></g>
  <path d="M0 ${HORIZON - 14} C 40 ${HORIZON - 30}, 80 ${HORIZON - 26}, 110 ${HORIZON - 8} C 130 ${HORIZON + 2}, 170 ${HORIZON + 2}, 190 ${HORIZON - 10} C 220 ${HORIZON - 30}, 255 ${HORIZON - 26}, 280 ${HORIZON - 16} L 280 ${HORIZON + 6} L 0 ${HORIZON + 6} Z" fill="${eve ? '#4a5a6c' : '#c4e3d6'}"/>
  ${pines(eve ? '#3d4b5b' : '#9ccbb9')}
  <rect x="0" y="${HORIZON}" width="${W}" height="${H - HORIZON}" fill="url(#gr${id})"/>
  <polygon points="${poly(0, 1, 1.22)}" fill="${eve ? '#8a96a0' : '#dfe6e1'}"/>
  <polygon points="${poly(0, 1)}" fill="url(#as${id})"/>
  <polyline points="${line(edge(-1, 0, 0.97, 0.9))}" fill="none" stroke="#fff" stroke-width="1.6" opacity=".9"/>
  <polyline points="${line(edge(1, 0, 0.97, 0.9))}" fill="none" stroke="#fff" stroke-width="1.6" opacity=".9"/>
  ${dashes(doneTo, 0.97)}
  ${doneTo > 0 ? `${solid(doneTo)}<polyline points="${line(edge(-1, 0, doneTo, 0.9))}" fill="none" stroke="#8ce6cb" stroke-width="2.2"/><polyline points="${line(edge(1, 0, doneTo, 0.9))}" fill="none" stroke="#8ce6cb" stroke-width="2.2"/>` : ''}
</svg>`
  }
  const STOPS = [
    { t: 0.3, n: 'Numbers and paying', side: 1, i: 4 },
    { t: 0.46, n: 'Getting around', side: -1, i: 5 },
    { t: 0.59, n: 'Small talk', side: 1, i: 6 },
    { t: 0.7, n: 'Asking for help', side: -1, i: 7 },
    { t: 0.78, n: 'Making a plan', side: 1, i: 8 },
  ]
  const sign = (s, state) => {
    const sc = 1 - s.t * 0.5,
      pole = 30 * sc + 4
    const x = Math.min(204, Math.max(62, xAt(s.t) + s.side * (wAt(s.t) * 0.61 + 34 * sc))),
      y = yAt(s.t)
    const num = state === 'done' ? '✓' : state === 'cur' ? s.i : ''
    return `<div class="sign ${state}" style="left:${f(x)}px;top:${f(y)}px;transform:translate(-50%,-100%) scale(${sc.toFixed(2)})"><span class="board">${num ? `<span class="num">${num}</span>` : ''}${s.n}</span><span class="pole" style="height:${f(pole)}px"></span><span class="foot"></span></div>`
  }
  const you = (t) =>
    `<span class="you" style="left:${f(xAt(t))}px;top:${f(yAt(t))}px"><span class="ringp"></span><span class="dot"></span></span>`
  const goal = (eve) =>
    `<span class="lvls ${eve ? 'eve' : ''}"><span class="lvl" style="left:222px;top:${HORIZON - 52}px"><span class="fp"><span class="fg"></span></span><b>A2</b></span><span class="lvl" style="left:86px;top:${HORIZON - 72}px"><span class="fp"><span class="fg"></span></span><b>B1</b></span><span class="lvl" style="left:160px;top:${HORIZON - 94}px"><span class="fp"><span class="fg"></span></span><b>B2 · YKI</b></span></span>`
  const prog = (n) =>
    `<span class="prog">${Array.from({ length: 12 }, (_, i) => `<i class="${i < n ? 'f' : ''}"></i>`).join('')}</span>`
  const road = (
    states,
    doneTo,
    youT,
    card,
    eve,
  ) => `<div class="scene">${land(doneTo, eve)}${goal(eve)}${STOPS.map((s, i) => sign(s, states[i])).join('')}${you(youT)}</div>
  <div class="topbar">${prog(1)}<span class="av">A</span></div>${card}`

  const sections = [
    {
      h: 'End of a lesson, three ways',
      p: 'What you gained in this lesson.',
      screens: [
        [
          'A. No numbers',
          'Only the line you can now say.',
          ph(`${vista()}<div class="body over" style="padding-top:10px">
      <span class="done-orb"></span><p class="big">Now you can say this.</p>
      <div class="milk" style="padding:11px 13px;text-align:center"><div style="font-size:16px;font-weight:600">Voinks mä maksaa kortilla?</div><div class="small">Can I pay by card?</div></div>
      
      <div class="grow"></div>
      <div class="milk" style="padding:11px 13px;display:grid;gap:8px;font-size:12px"><span>Add your email to save your progress.</span><span class="plain">Add your email</span></div>
      <span class="pill">Done<i></i></span><span class="hint">Saved on this device.</span></div>`),
        ],
        [
          'B. One quiet line',
          'The two numbers as a short sentence under the line.',
          ph(`${vista()}<div class="body over" style="padding-top:10px">
      <span class="done-orb"></span><p class="big">Now you can say this.</p>
      <div class="milk" style="padding:11px 13px;text-align:center"><div style="font-size:16px;font-weight:600">Voinks mä maksaa kortilla?</div><div class="small">Can I pay by card?</div></div>
      <p class="hint" style="font-size:10.5px">11 new words · 8 lines said out loud</p>
      <div class="grow"></div>
      <div class="milk" style="padding:11px 13px;display:grid;gap:8px;font-size:12px"><span>Add your email to save your progress.</span><span class="plain">Add your email</span></div>
      <span class="pill">Done<i></i></span><span class="hint">Saved on this device.</span></div>`),
        ],
        [
          'C. The new words themselves',
          'The words you met, tap one to hear it. The count sits in the heading.',
          ph(`${vista()}<div class="body over" style="padding-top:10px">
      <span class="done-orb"></span><p class="big">Now you can say this.</p>
      <div class="milk" style="padding:11px 13px;text-align:center"><div style="font-size:16px;font-weight:600">Voinks mä maksaa kortilla?</div><div class="small">Can I pay by card?</div></div>
      <div class="milk" style="padding:11px 13px;display:grid;gap:8px"><span style="font-size:10.5px;color:var(--quiet)">11 new words</span><div class="chips"><span>voinks</span><span>maksaa</span><span>kortilla</span><span>käteisellä</span><span>kuitti</span><span>+6</span></div></div>
      <div class="grow"></div>
      <div class="milk" style="padding:11px 13px;display:grid;gap:8px;font-size:12px"><span>Add your email to save your progress.</span><span class="plain">Add your email</span></div>
      <span class="pill">Done<i></i></span><span class="hint">Saved on this device.</span></div>`),
        ],
      ],
    },
  ]

  document.getElementById('out').outerHTML = sections
    .map(
      (sec) => `
  <section><h2>${sec.h}</h2><p>${sec.p}</p>
    <div class="row">${sec.screens.map(([n, c, html]) => `<figure>${html}<figcaption><b>${n}</b>${c}</figcaption></figure>`).join('')}</div>
  </section>`,
    )
    .join('')
</script>
